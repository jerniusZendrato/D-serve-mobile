<!-- Mobile-First Login Component -->
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-50 via-white to-blue-50 p-4">
  <div class="w-full max-w-md">
    <!-- Login Card -->
    <div class="bg-white rounded-3xl shadow-xl border border-gray-100 overflow-hidden">
      <!-- Header Section -->
      <div class="px-6 pt-8 pb-6 text-center bg-gradient-to-b from-indigo-50 to-white">
        <!-- Logo -->
        <div class="mb-6">
          <img 
            src="assets/images/logov2.png" 
            alt="Logo Perusahaan" 
            class="w-20 h-20 sm:w-24 sm:h-24 mx-auto object-contain"
          />
        </div>
        
        <!-- Title -->
        <h1 class="text-2xl sm:text-3xl font-bold text-gray-800 mb-2">
          Monitoring Tambang
        </h1>
        <p class="text-gray-600 text-sm sm:text-base">
          Silakan masuk untuk melanjutkan
        </p>
      </div>

      <!-- Form Section -->
      <div class="px-6 pb-8">
        <form (ngSubmit)="onLogin()" class="space-y-6">
          <!-- Username Field -->
          <div>
            <label 
              for="username" 
              class="block text-sm font-semibold text-gray-700 mb-2">
              Username
            </label>
            <div class="relative">
              <input 
                type="text" 
                id="username"
                [(ngModel)]="username" 
                name="username" 
                (ngModelChange)="username = $event.toUpperCase()" 
                class="w-full px-4 py-3 text-base border border-gray-300 rounded-xl bg-gray-50 
                       focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent focus:bg-white
                       transition-all duration-200 placeholder-gray-400"
                placeholder="Masukkan username" 
                required
                autocomplete="username"
              />
              <div class="absolute inset-y-0 right-0 flex items-center pr-3">
                <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
              </div>
            </div>
          </div>

          <!-- Password Field -->
          <div>
            <label 
              for="password" 
              class="block text-sm font-semibold text-gray-700 mb-2">
              Password
            </label>
            <div class="relative">
              <input 
                [type]="showPassword ? 'text' : 'password'" 
                id="password"
                [(ngModel)]="password" 
                name="password"
                class="w-full px-4 py-3 text-base border border-gray-300 rounded-xl bg-gray-50 
                       focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent focus:bg-white
                       transition-all duration-200 placeholder-gray-400"
                placeholder="Masukkan password" 
                required
                autocomplete="current-password"
              />
              <button
                type="button"
                (click)="togglePasswordVisibility()"
                class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 hover:text-gray-600 transition-colors">
                <svg *ngIf="!showPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
                <svg *ngIf="showPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21" />
                </svg>
              </button>
            </div>
          </div>

          <!-- Remember Me -->
          <div class="flex items-center justify-between">
            <label class="flex items-center">
              <input 
                type="checkbox" 
                class="w-4 h-4 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500 focus:ring-2"
              />
              <span class="ml-2 text-sm text-gray-600">Ingat saya</span>
            </label>
            
            <a href="#" class="text-sm text-indigo-600 hover:text-indigo-700 font-medium transition-colors">
              Lupa password?
            </a>
          </div>

          <!-- Submit Button -->
          <button 
            type="submit"
            [disabled]="isLoading"
            class="w-full bg-indigo-600 hover:bg-indigo-700 disabled:bg-indigo-400 text-white font-semibold 
                   py-3 px-4 rounded-xl transition-all duration-200 transform hover:scale-[1.02] active:scale-[0.98]
                   focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2
                   disabled:cursor-not-allowed disabled:transform-none"
          >
            <span *ngIf="!isLoading" class="flex items-center justify-center space-x-2">
              <span>Masuk</span>
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
              </svg>
            </span>
            
            <span *ngIf="isLoading" class="flex items-center justify-center space-x-2">
              <svg class="animate-spin w-5 h-5" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              <span>Memproses...</span>
            </span>
          </button>
        </form>

        <!-- Additional Links -->
        <div class="mt-6 pt-6 border-t border-gray-100 text-center">
          <p class="text-sm text-gray-600">
            Butuh bantuan? 
            <a href="#" class="text-indigo-600 hover:text-indigo-700 font-medium transition-colors">
              Hubungi Support
            </a>
          </p>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="mt-6 text-center">
      <p class="text-xs text-gray-500">
        © 2024 Monitoring Tambang. All rights reserved.
      </p>
    </div>
  </div>
</div>
