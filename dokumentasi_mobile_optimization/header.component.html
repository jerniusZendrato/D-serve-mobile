<header class="bg-white shadow-md px-4 sm:px-8 py-3 sm:py-4 sticky top-0 z-50">
  <div class="flex items-center justify-between">
    <!-- Logo / Brand -->
    <div class="flex items-center space-x-2 sm:space-x-4">
      <img src="assets/images/logov2.png" alt="Logo" class="w-8 h-8 sm:w-10 sm:h-10" />
      <h1 class="hidden sm:block text-xl font-bold text-gray-800">Monitoring Tambang</h1>
    </div>

    <!-- Mobile Menu Button -->
    <button 
      class="sm:hidden p-2 rounded-md text-gray-600 hover:text-indigo-600 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-indigo-500"
      (click)="toggleMobileMenu()"
      aria-label="Toggle menu">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path *ngIf="!isMobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        <path *ngIf="isMobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>

    <!-- Desktop Navigation -->
    <div class="hidden sm:flex items-center space-x-4 lg:space-x-6 flex-1 justify-end">
      <!-- Search bar - Hidden on mobile, shown on tablet+ -->
      <div class="hidden md:flex flex-1 max-w-md mx-4 lg:mx-8">
        <input
          type="text"
          placeholder="Search..."
          class="w-full rounded-md border border-gray-300 px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
        />
      </div>

      <!-- Action Icons & Profile -->
      <div class="flex items-center space-x-4">
        <!-- Notification Icon -->
        <button 
          aria-label="Notifications" 
          class="relative p-2 text-gray-600 hover:text-indigo-600 hover:bg-gray-100 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500" 
          (click)="toggleNotifikasi()">
          <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6 6 0 00-5-5.917V5a2 2 0 10-4 0v.083A6 6 0 004 11v3.159c0 .538-.214 1.055-.595 1.436L2 17h5m0 0v1a3 3 0 006 0v-1m-6 0h6" />
          </svg>
          <span class="absolute -top-1 -right-1 inline-block w-3 h-3 bg-red-500 rounded-full border-2 border-white"></span>
        </button>

        <!-- Profile dropdown -->
        <div class="relative group">
          <button class="flex items-center p-2 rounded-md hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <svg class="w-5 h-5 sm:w-6 sm:h-6 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
          </button>

          <!-- Dropdown menu -->
          <div class="absolute right-0 mt-2 w-48 bg-white border border-gray-200 rounded-lg shadow-lg opacity-0 group-hover:opacity-100 invisible group-hover:visible transition-all duration-200 transform scale-95 group-hover:scale-100">
            <div class="py-1">
              <a href="#" class="block px-4 py-3 text-sm text-gray-700 hover:bg-indigo-50 hover:text-indigo-600 transition-colors">
                <div class="flex items-center space-x-2">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
                  </svg>
                  <span>Kalkulator</span>
                </div>
              </a>
              <hr class="border-gray-100">
              <button 
                (click)="logout()" 
                class="w-full text-left px-4 py-3 text-sm text-red-600 hover:bg-red-50 transition-colors">
                <div class="flex items-center space-x-2">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                  </svg>
                  <span>Logout</span>
                </div>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Mobile Menu Overlay -->
  <div 
    *ngIf="isMobileMenuOpen"
    class="sm:hidden fixed inset-0 z-50 bg-black bg-opacity-50"
    (click)="closeMobileMenu()">
  </div>

  <!-- Mobile Menu Panel -->
  <div 
    class="sm:hidden fixed top-0 right-0 h-full w-80 max-w-[85vw] bg-white shadow-xl transform transition-transform duration-300 ease-in-out z-50"
    [class.translate-x-0]="isMobileMenuOpen"
    [class.translate-x-full]="!isMobileMenuOpen">
    
    <!-- Mobile Menu Header -->
    <div class="flex items-center justify-between p-4 border-b border-gray-200">
      <h2 class="text-lg font-semibold text-gray-800">Menu</h2>
      <button 
        (click)="closeMobileMenu()"
        class="p-2 rounded-md text-gray-500 hover:text-gray-700 hover:bg-gray-100">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Mobile Search -->
    <div class="p-4 border-b border-gray-200">
      <input
        type="text"
        placeholder="Search..."
        class="w-full rounded-lg border border-gray-300 px-4 py-3 text-base focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
      />
    </div>

    <!-- Mobile Menu Items -->
    <div class="flex-1 py-4">
      <!-- Notifications -->
      <button 
        (click)="toggleNotifikasi(); closeMobileMenu()"
        class="w-full flex items-center space-x-3 px-4 py-4 text-left hover:bg-gray-50 transition-colors">
        <div class="relative">
          <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6 6 0 00-5-5.917V5a2 2 0 10-4 0v.083A6 6 0 004 11v3.159c0 .538-.214 1.055-.595 1.436L2 17h5m0 0v1a3 3 0 006 0v-1m-6 0h6" />
          </svg>
          <span class="absolute -top-1 -right-1 inline-block w-3 h-3 bg-red-500 rounded-full border-2 border-white"></span>
        </div>
        <span class="text-base text-gray-700">Notifikasi</span>
      </button>

      <!-- Calculator -->
      <button 
        (click)="closeMobileMenu()"
        class="w-full flex items-center space-x-3 px-4 py-4 text-left hover:bg-gray-50 transition-colors">
        <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
        </svg>
        <span class="text-base text-gray-700">Kalkulator</span>
      </button>
    </div>

    <!-- Mobile Menu Footer -->
    <div class="border-t border-gray-200 p-4">
      <button 
        (click)="logout(); closeMobileMenu()"
        class="w-full flex items-center justify-center space-x-2 px-4 py-3 bg-red-50 text-red-600 rounded-lg hover:bg-red-100 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
        <span class="font-medium">Logout</span>
      </button>
    </div>
  </div>
</header>
