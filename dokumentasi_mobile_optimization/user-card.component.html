<!-- Mobile-First User Card Component -->
<div class="bg-white shadow-sm rounded-xl p-4 sm:p-6 mb-4 sm:mb-6 border border-gray-100">
  <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center space-y-4 sm:space-y-0">
    
    <!-- User Info Section -->
    <div class="flex items-center space-x-4">
      <!-- User Icon -->
      <div class="flex-shrink-0">
        <div class="w-12 h-12 sm:w-10 sm:h-10 bg-indigo-100 rounded-full flex items-center justify-center">
          <svg
            class="w-6 h-6 sm:w-5 sm:h-5 text-indigo-600"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
            ></path>
          </svg>
        </div>
      </div>

      <!-- User Details -->
      <div class="flex-1 min-w-0" *ngIf="data2">
        <h3 class="text-lg sm:text-base font-semibold text-gray-800 truncate">
          {{ data2.user.username }}
        </h3>
        
        <!-- Unit Info or Call to Action -->
        <div class="mt-1">
          <p *ngIf="data2.user.unit == null" class="text-sm">
            <a 
              href="#" 
              class="inline-flex items-center space-x-1 text-indigo-600 font-medium hover:text-indigo-700 transition-colors duration-200"
              [routerLink]="['/home/unit']"
            >
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
              </svg>
              <span>Klik untuk input unit</span>
            </a>
          </p>
          
          <div *ngIf="data2.user.unit != null" class="flex flex-col sm:flex-row sm:items-center sm:space-x-2">
            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800">
              {{ data2.user.unit.unitType.name }}
            </span>
            <span class="text-sm text-gray-600 mt-1 sm:mt-0">
              {{ data2.user.unit.name }}
            </span>
          </div>
        </div>
      </div>
    </div>

    <!-- Logo Section -->
    <div class="flex justify-center sm:justify-end">
      <img
        src="assets/images/logov2.png"
        alt="Logo"
        class="w-12 h-12 sm:w-14 sm:h-14 object-contain"
      />
    </div>
  </div>

  <!-- Status Indicator (if needed) -->
  <div *ngIf="data2?.user?.unit" class="mt-4 pt-4 border-t border-gray-100">
    <div class="flex items-center justify-between text-sm">
      <span class="text-gray-500">Status:</span>
      <span class="inline-flex items-center space-x-1 text-green-600">
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
        </svg>
        <span class="font-medium">Aktif</span>
      </span>
    </div>
  </div>
</div>
