<!-- Mobile-First Icon Menu Component -->
<div class="px-4 sm:px-6 lg:px-8">
  <!-- Section Title -->
  <div class="mb-4">
    <h2 class="text-lg font-semibold text-gray-800">Unit Tersedia</h2>
    <p class="text-sm text-gray-600">Pilih unit untuk membuat pesanan</p>
  </div>

  <!-- Horizontal Scrollable Menu -->
  <div class="overflow-x-auto scrollbar-hide pb-2">
    <div class="flex space-x-3 sm:space-x-4 min-w-max">
      <button
        *ngFor="let menu of availableUnits; trackBy: trackByMenuId"
        (click)="selectMenu(menu.id)"
        [ngClass]="[
          'flex flex-col items-center justify-center min-w-[80px] min-h-[80px] sm:min-w-[90px] sm:min-h-[90px] rounded-2xl cursor-pointer transition-all duration-200 flex-shrink-0 border-2 shadow-sm hover:shadow-md active:scale-95',
          selectedMenuId === menu.id
            ? 'bg-indigo-600 text-white border-indigo-600 shadow-lg transform scale-105'
            : 'bg-white text-gray-700 border-gray-200 hover:bg-indigo-50 hover:text-indigo-600 hover:border-indigo-300'
        ]"
        [attr.aria-label]="'Pilih unit ' + menu.name"
      >
        <!-- Icon placeholder or custom icon -->
        <div class="mb-2">
          <div 
            class="w-8 h-8 sm:w-10 sm:h-10 rounded-lg flex items-center justify-center"
            [ngClass]="selectedMenuId === menu.id ? 'bg-white/20' : 'bg-indigo-100'">
            <svg 
              class="w-5 h-5 sm:w-6 sm:h-6" 
              [ngClass]="selectedMenuId === menu.id ? 'text-white' : 'text-indigo-600'"
              fill="none" 
              stroke="currentColor" 
              viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-4m-5 0H9m0 0H5m0 0h2M7 7h10M7 11h10M7 15h10" />
            </svg>
          </div>
        </div>
        
        <!-- Unit Name -->
        <span class="text-xs sm:text-sm font-medium text-center leading-tight px-1 select-none">
          {{ menu.name }}
        </span>
        
        <!-- Unit Type Badge -->
        <span 
          class="mt-1 px-2 py-0.5 rounded-full text-xs font-medium"
          [ngClass]="selectedMenuId === menu.id 
            ? 'bg-white/20 text-white' 
            : 'bg-gray-100 text-gray-600'">
          {{ menu.unitType?.name || 'Unit' }}
        </span>
      </button>
    </div>
  </div>

  <!-- Scroll Indicator -->
  <div class="flex justify-center mt-3 sm:hidden">
    <div class="flex space-x-1">
      <div class="w-2 h-2 bg-gray-300 rounded-full"></div>
      <div class="w-2 h-2 bg-gray-300 rounded-full"></div>
      <div class="w-2 h-2 bg-indigo-500 rounded-full"></div>
      <div class="w-2 h-2 bg-gray-300 rounded-full"></div>
    </div>
  </div>
</div>

<!-- Mobile-Optimized Modal -->
<div 
  *ngIf="showModal" 
  class="fixed inset-0 flex items-end sm:items-center justify-center bg-black bg-opacity-50 z-50 p-4"
  (click)="cancelAction()">
  
  <!-- Modal Content -->
  <div 
    class="bg-white rounded-t-3xl sm:rounded-2xl w-full sm:w-96 max-w-md transform transition-all duration-300 ease-out"
    (click)="$event.stopPropagation()">
    
    <!-- Modal Header -->
    <div class="p-6 pb-4">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-xl font-semibold text-gray-800">Konfirmasi Pesanan</h2>
        <button 
          (click)="cancelAction()"
          class="p-2 rounded-full hover:bg-gray-100 transition-colors">
          <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
      
      <p class="text-gray-600 mb-6">
        Apakah Anda yakin ingin memesan <strong class="text-indigo-600">{{ menuToConfirm }}</strong>?
      </p>
    </div>

    <!-- Modal Body -->
    <div class="px-6 pb-6">
      <!-- Comment Input -->
      <div class="mb-6">
        <label for="comment" class="block text-sm font-medium text-gray-700 mb-2">
          Komentar (opsional)
        </label>
        <textarea
          id="comment"
          [(ngModel)]="komentar"
          placeholder="Tambahkan komentar atau catatan khusus..."
          class="w-full border border-gray-300 rounded-lg p-3 text-base resize-none focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
          rows="3"
        ></textarea>
      </div>

      <!-- Action Buttons -->
      <div class="flex flex-col sm:flex-row space-y-3 sm:space-y-0 sm:space-x-3">
        <button 
          (click)="cancelAction()" 
          class="flex-1 px-6 py-3 bg-gray-100 text-gray-700 rounded-lg font-medium hover:bg-gray-200 transition-colors focus:outline-none focus:ring-2 focus:ring-gray-500">
          Batal
        </button>
        <button 
          (click)="confirmAction()" 
          class="flex-1 px-6 py-3 bg-indigo-600 text-white rounded-lg font-medium hover:bg-indigo-700 transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm">
          Konfirmasi Pesanan
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Custom Scrollbar Styles -->
<style>
.scrollbar-hide {
  -ms-overflow-style: none;
  scrollbar-width: none;
}
.scrollbar-hide::-webkit-scrollbar {
  display: none;
}
</style>
