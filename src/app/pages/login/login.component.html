<div class="min-h-screen flex items-center justify-center bg-gray-100 p-4">
  <div class="w-full max-w-sm bg-white rounded-2xl shadow-lg p-6">
    <!-- Logo / Judul -->
   <div class="text-center mb-6">
  <img src="assets/images/logov2.png" alt="Logo Perusahaan" class="w-24 mx-auto mb-4">
  
  <h1 class="text-2xl font-bold text-gray-800">Monitoring Tambang</h1>
  <p class="text-gray-500 text-sm">Silakan masuk untuk melanjutkan</p>
</div>

    <!-- Form -->
    <form (ngSubmit)="onLogin()">
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
        <input type="text" [(ngModel)]="username" name="username" (ngModelChange)="username = $event.toUpperCase()" 
          class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Masukkan username" required>
      </div>

      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" [(ngModel)]="password" name="password"
          class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Masukkan password" required>
      </div>

      <button type="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg transition duration-200">
        Masuk
      </button>
    </form>

    <!-- Link tambahan -->
    <p class="mt-4 text-center text-sm text-gray-500">
      Lupa password? <a href="#" class="text-blue-600 hover:underline">Reset</a>
    </p>
  </div>
</div>
