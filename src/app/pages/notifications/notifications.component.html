<div class="p-4">
  <!-- Tombol Back -->
  <button 
    class="mb-4 px-3 py-1 bg-gray-200 rounded hover:bg-gray-300"
    (click)="goBack()">
    ← Kembali
  </button>

  <h2 class="text-lg font-bold mb-4">Notifikasi</h2>

  <div *ngFor="let notif of orderanList" 
     class="p-4 mb-3 bg-white rounded-2xl shadow-sm hover:shadow-md transition-all duration-200 border border-gray-200 w-full max-w-md mx-auto">
  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center space-y-2 sm:space-y-0 sm:space-x-3">
    <div class="flex items-start space-x-3">
      <!-- Icon status -->
      <div class="w-10 h-10 flex items-center justify-center rounded-full bg-indigo-100 text-indigo-600 flex-shrink-0">
        <i class="fas fa-bell"></i>
      </div>
      <div class="flex-1">
        <p class="font-semibold text-gray-800 text-sm sm:text-base">
          Pesanan Masuk! {{ notif.targetUnitTypeName }}
        </p>
        <p class="text-xs sm:text-sm text-gray-500 mt-0.5">Lokasi: {{ notif.location }}</p>
        <p class="text-xs sm:text-sm text-gray-500 mt-0.5">Status: 
          <span class="font-medium text-indigo-600">{{ notif.status }}</span>
        </p>
        <p *ngIf="notif.description" class="text-xs sm:text-sm text-gray-500 mt-1">Pesan: {{ notif.description }}</p>
      </div>
    </div>
    <span class="text-xs text-gray-400 mt-1 sm:mt-0">{{ notif.prosessAt? (notif.prosessAt | date:'short') : '' }}</span>
  </div>
  <button 
    class="mt-3 w-full sm:w-auto px-4 py-2 text-sm font-medium text-white bg-indigo-500 rounded-lg hover:bg-indigo-600 transition-colors duration-200"
    (click)="postAccepted(notif.id)">
    Accepted
  </button>
</div>


  <div *ngIf="orderanList.length === 0" class="text-gray-400 text-center mt-4">
    Belum ada notifikasi
  </div>
</div>
