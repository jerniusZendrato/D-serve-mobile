
   <app-user-card></app-user-card>



<div class="w-64">
  <label for="location" class="block mb-1 text-sm font-semibold text-gray-700">Pilih Lokasi</label>
  <select
    id="location"
    name="location"
    [(ngModel)]="selectedLocation"
    (change)="simpanlokasi(selectedLocation)" 
    class="block w-full rounded-md border border-gray-300 bg-white py-2 px-3 text-gray-700 shadow-sm
           focus:border-indigo-500 focus:ring-2 focus:ring-indigo-400 focus:outline-none
           hover:border-indigo-400 transition"
  >
    <option value="" disabled>-- Pilih lokasi --</option>
    <option *ngFor="let loc of locations" [value]="loc.name">
      {{ loc.name }}
    </option>
  </select>

  <p class="mt-2 text-sm text-gray-600">
    Lokasi dipilih: <span class="font-semibold">{{ selectedLocation || '-' }}</span>
  </p>
</div>
