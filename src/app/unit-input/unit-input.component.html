<button 
    class="mb-4 px-3 py-1 bg-gray-200 rounded hover:bg-gray-300"
    (click)="goBack()">
    Kembali
  </button>


<div class="p-6 max-w-sm mx-auto bg-white rounded-xl shadow-lg space-y-4 m-4">
  <div class="flex items-center space-x-4">
    <div class="flex-shrink-0">
      <svg class="h-10 w-10 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
      </svg>
    </div>
    <div>
      <div class="text-xl font-medium text-black">Input Unit</div>
      <p class="text-gray-500 text-sm">Silakan masukkan nama unit Anda.</p>
    </div>
  </div>

  <form (ngSubmit)="onSubmit()">
  <div class="space-y-4">
    <label class="block text-sm font-medium text-gray-700">Pilih Unit</label>
    <select
      id="unitName"
      name="unitName"
      [(ngModel)]="unitName"
      required
      class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
    >
      <option value="" disabled selected>-- Pilih salah satu unit --</option>
      <option *ngFor="let unit of availableUnits" [ngValue]="unit.id">
        {{ unit.unitType.name }} -{{ unit.name }}
      </option>
    </select>
  </div>

  <div class="mt-6">
    <button
      type="submit"
      [disabled]="!unitName"
      class="w-full inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed"
    >
      Simpan
    </button>
  </div>
</form>
</div>
