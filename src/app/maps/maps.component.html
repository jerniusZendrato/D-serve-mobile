<!-- Header -->
<div class="flex items-center justify-between p-4 bg-white shadow-md">
  <button (click)="goBack()" 
          class="flex items-center space-x-1 px-3 py-1 rounded-lg bg-gray-200 hover:bg-gray-300 transition">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
    </svg>
    <span>Back</span>
  </button>
  <h1 class="text-lg font-semibold">Peta Lokasi Order</h1>
  <div></div>
</div>

<!-- Info Card -->
<div class="absolute top-20 left-4 bg-white p-3 rounded-xl shadow-md z-10 w-64">
  <p class="font-semibold">Koordinat</p>
  <p class="text-sm text-gray-600">Lat: {{ lat.toFixed(5) }}</p>
  <p class="text-sm text-gray-600">Lng: {{ lng.toFixed(5) }}</p>
</div>

<!-- Map Container -->
<div id="map" style="width:100%; height: calc(100vh - 64px);"></div>
