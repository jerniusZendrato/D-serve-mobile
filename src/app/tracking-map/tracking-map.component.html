<div class="w-full h-[500px] rounded-lg overflow-hidden shadow-lg">
  <google-map
    [center]="center"
    [zoom]="15"
    [options]="options"
    height="100%"
    width="100%">
    <!-- Marker Helper -->
    <map-marker
      [position]="helperPosition"
      [label]="'Helper'">
    </map-marker>
  </google-map>
</div>

<!-- Tombol contoh update posisi -->
<div class="mt-4 flex gap-2">
  <button (click)="updateHelper(-6.246, 106.81)" class="px-3 py-1 bg-blue-600 text-white rounded">
    Geser Helper ke Timur
  </button>
  <button (click)="updateHelper(-6.25, 106.79)" class="px-3 py-1 bg-green-600 text-white rounded">
    Geser Helper ke Barat
  </button>
</div>
