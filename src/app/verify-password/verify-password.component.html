<div class="min-h-screen flex items-center justify-center bg-gray-100 p-4">
  <div class="bg-white shadow-lg rounded-xl max-w-md w-full p-8 space-y-6">
    <!-- Header -->
    <div class="text-center">
      <h2 class="text-2xl font-bold text-gray-800 mb-1">Verifikasi Password</h2>
      <p class="text-gray-500 text-sm">
        Masukkan password Anda untuk melanjutkan.
      </p>
      <p *ngIf="authData" class="mt-2 text-gray-700 font-medium">
        User: <span class="text-gray-900">{{ authData.user.username }}</span>
      </p>
    </div>

    <!-- Form -->
    <form [formGroup]="verifyForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="••••••••"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
        />
      </div>

      <p *ngIf="errorMsg" class="text-red-500 text-sm font-medium">{{ errorMsg }}</p>

      <button
        type="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg shadow-md transition transform hover:scale-105"
      >
        Verifikasi
      </button>
    </form>

    <!-- Info / Footer -->
    <div class="text-center mt-4 text-gray-400 text-sm">
      Jika Anda lupa password, silakan hubungi administrator.
    </div>
  </div>
<div
  *ngIf="showToast"
  [ngClass]="getToastClass()"
  class="fixed top-4 left-1/2 transform -translate-x-1/2 px-4 py-3 rounded-xl shadow-lg flex items-center justify-between gap-3 max-w-sm w-full text-sm animate-fade-in z-50"
>
  <div class="flex items-center gap-3">
    <svg *ngIf="toastType === 'success'" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
    </svg>
    <svg *ngIf="toastType === 'error'" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
    </svg>
    <span class="font-medium">{{ toastMsg }}</span>
  </div>
  <button *ngIf="closable" (click)="closeToast()" class="p-1 rounded-full hover:bg-white/20 transition-colors">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
    </svg>
  </button>
</div>

</div>
